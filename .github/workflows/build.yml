name: build

on:
  push:
    branches:
      - main
      - 'theme/**'
  workflow_dispatch:
  schedule:
    # Daily safety net; the 30-minute polling loop was removed.
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: blog-changed
      cancel-in-progress: true
    outputs:
      content: ${{ steps.detect.outputs.content }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect content changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "content=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "content=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "content=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- content; then
            echo "content=false" >> "$GITHUB_OUTPUT"
          else
            echo "content=true" >> "$GITHUB_OUTPUT"
          fi

  contracts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: blog-contracts
      cancel-in-progress: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.5

      - name: Test anchor contracts
        run: forge test --root contracts -vvv

  anchor:
    needs: [changed, contracts]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.changed.outputs.content == 'true' &&
      needs.contracts.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: anchor
    concurrency:
      group: blog-anchor
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch anchors branch
        run: git fetch origin '+refs/heads/anchors:refs/remotes/origin/anchors' || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install compiler dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.5

      - name: Anchor pushed commit
        env:
          ANCHOR_PRIVATE_KEY: ${{ secrets.ANCHOR_PRIVATE_KEY }}
          ANCHOR_RPC_URL: ${{ vars.ANCHOR_RPC_URL || 'https://base-rpc.publicnode.com' }}
        run: |
          if npm run blog -- anchor \
            --commit "$GITHUB_SHA" \
            --yes --json \
            --private-key-env ANCHOR_PRIVATE_KEY \
            --rpc-url "$ANCHOR_RPC_URL" \
            --author-name "github-actions[bot]" \
            --author-email "41898282+github-actions[bot]@users.noreply.github.com"; then
            exit 0
          fi
          echo "::warning::anchor command failed; checking whether the transaction landed before retrying"
          npm run blog -- anchor \
            --commit "$GITHUB_SHA" \
            --recover-only --json \
            --rpc-url "$ANCHOR_RPC_URL" \
            --author-name "github-actions[bot]" \
            --author-email "41898282+github-actions[bot]@users.noreply.github.com"

  build:
    needs: [changed, anchor]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: blog-build
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch theme and anchors branches
        run: |
          git fetch --prune origin \
            '+refs/heads/theme/*:refs/remotes/origin/theme/*' \
            '+refs/heads/anchors:refs/remotes/origin/anchors' || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install compiler dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Validate content
        run: npm run blog -- check --json

      - name: Build all themes and assemble dist
        run: npm run build:all
        env:
          CI: 'true'
          SW_CHECK_INTERVAL_MS: '1800000'
          SW_BUILD_ID: ${{ github.sha }}

      - name: Validate deployment artifacts
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/_headers
          test -d dist/_themes
          test -f dist/_sys/sys.js

      - name: Summarize themes
        run: |
          echo '## Themes' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.themes[] | "- `\(.id)`: \(.sizeKB) KiB, commit `\(.commit)`, default=\(.isDefault)"' \
            dist/manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Release: \`$(jq -r '.releaseId' dist/manifest.json)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-dist
          path: dist
          retention-days: 7
